# Merge this scrape job into the Prometheus configuration on the monitoring host.
# Replace the placeholders with the AI server's current LAN address and hostname.
# The active exporter profile is flash512-qwen-single: it scrapes the Strata
# Flash engine on loopback port 8082 (GPUs 0 and 1) and the remaining llamAmpere
# replica on 8081 (GPU 2), then emits model, gpu, and gpu_uuid labels. The model
# servers themselves remain loopback-only. Do not add separate Prometheus
# targets for those ports.
scrape_configs:
  - job_name: ai-server
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["<AI_SERVER_LAN_IP>:9108"]
        labels:
          host: <AI_SERVER_HOST>

  # CPU power/utilization profiler (RAPL package power + learned bucket curve).
  - job_name: ai-server-cpu-power
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["<AI_SERVER_LAN_IP>:9109"]
        labels:
          host: <AI_SERVER_HOST>
