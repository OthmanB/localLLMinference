# Merge this scrape job into Prometheus on rtx-4000-test.
# Use the RTX 5090 host's Tailscale address printed by the metrics installer.
# Port 9108 is deliberately bound only to the AI host's Tailscale interface.
scrape_configs:
  - job_name: ai-rtx5090-vllm-tp2
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["<RTX5090_TAILSCALE_IP>:9108"]
        labels:
          host: monstera-rtx5090
