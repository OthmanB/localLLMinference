[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lan-inference-gateway"
version = "0.1.0"
description = "Runtime-independent OpenAI-compatible LAN inference gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
lan-inference-gateway = "lan_inference_gateway.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
